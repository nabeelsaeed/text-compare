<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Text Compare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two input panes on top, a control strip, a stats row, then the result (inline or side by side). */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #1b2229;
  --muted: #5a6670;
  --line: #d5dce2;
  --accent: #1f5f99;
  --on-accent: #ffffff;
  --del-mark: #a61b1b;
  --ins-mark: #17692f;
  --del-soft: #fbe9e9;
  --del-strong: #f5b9b9;
  --del-fg: #a61b1b;
  --ins-soft: #e4f4ea;
  --ins-strong: #a9e0bd;
  --ins-fg: #17692f;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202124;
    --surface: #292a2d;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --line: #3c4043;
    --accent: #1f5f99;
    --on-accent: #ffffff;
    --del-mark: #f9b4ad;
    --ins-mark: #a5deb5;
    --del-soft: #3a2523;
    --del-strong: #983530;
    --del-fg: #f9b4ad;
    --ins-soft: #1e3a2a;
    --ins-strong: #276a3d;
    --ins-fg: #a5deb5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202124;
  --surface: #292a2d;
  --fg: #e8eaed;
  --muted: #9aa0a6;
  --line: #3c4043;
  --accent: #1f5f99;
  --on-accent: #ffffff;
  --del-mark: #f9b4ad;
  --ins-mark: #a5deb5;
  --del-soft: #3a2523;
  --del-strong: #983530;
  --del-fg: #f9b4ad;
  --ins-soft: #1e3a2a;
  --ins-strong: #276a3d;
  --ins-fg: #a5deb5;
  color-scheme: dark;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.theme-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; font: inherit; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); }
.theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); max-width: 65ch; }

.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pane { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pane label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
textarea {
  width: 100%;
  min-height: 190px;
  resize: vertical;
  font: 13px/1.6 var(--font-mono);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
}
textarea::placeholder { color: var(--muted); opacity: 1; }
textarea:focus-visible, button:focus-visible, input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.group .cap { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; border: 0; background: transparent; color: var(--fg); padding: 5px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.check-group { display: inline-flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; display: grid; place-content: center; width: 16px; height: 16px; margin: 0; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); cursor: pointer; }
.check input::after { content: ""; width: 9px; height: 9px; background: var(--on-accent); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transform: scale(0); }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { transform: scale(1); }
.actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.btn { font: inherit; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }

.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; padding: 12px 0; border-block: 1px solid var(--line); }
.stat { display: flex; align-items: baseline; gap: 8px; }
.stat b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); }
.stat.del b { background: var(--del-strong); color: var(--del-fg); padding: 0 8px; border-radius: 4px; }
.stat.ins b { background: var(--ins-strong); color: var(--ins-fg); padding: 0 8px; border-radius: 4px; }
.stat.note { margin-left: auto; color: var(--muted); }

.result { display: flex; flex-direction: column; gap: 8px; }
.result-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.result-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
.legend .l-del i { background: var(--del-strong); }
.legend .l-ins i { background: var(--ins-strong); }

.out { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
.flow { margin: 0; padding: 14px 16px; font: 13px/1.7 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: 1fr 1fr; }
.split .col { min-width: 0; }
.split .col + .col { border-left: 2px solid var(--line); }
.split .hd { padding: 6px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line); }
del, ins { text-decoration: none; border-radius: 2px; }
del { background: var(--del-strong); color: var(--del-fg); text-decoration: line-through; text-decoration-thickness: 1px; }
ins { background: var(--ins-strong); color: var(--ins-fg); }

table.lines { border-collapse: collapse; width: 100%; min-width: 620px; font: 13px/1.6 var(--font-mono); }
.lines td { vertical-align: top; padding: 0 10px; }
.lines td.n { width: 1%; min-width: 38px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; user-select: none; border-right: 1px solid var(--line); background: var(--bg); }
.lines td.m { width: 1%; text-align: center; color: var(--muted); user-select: none; }
.lines td.t { white-space: pre-wrap; overflow-wrap: anywhere; }
.lines td.t + td.n { border-left: 1px solid var(--line); }
.lines td.t.del { background: var(--del-soft); }
.lines td.t.ins { background: var(--ins-soft); }
.lines td.empty { background: var(--bg); }
.lines tr.u-del td.t { background: var(--del-soft); }
.lines tr.u-ins td.t { background: var(--ins-soft); }
.lines tr.u-del td.m { color: var(--del-mark); }
.lines tr.u-ins td.m { color: var(--ins-mark); }

.credit { padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }

.empty-state { padding: 28px 16px; color: var(--muted); text-align: center; }

@media (max-width: 720px) {
  .inputs { grid-template-columns: 1fr; }
  .actions { margin-left: 0; }
  .stat.note { margin-left: 0; }
  .split { grid-template-columns: 1fr; }
  .split .col + .col { border-left: 0; border-top: 2px solid var(--line); }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Text Compare</h1>
      <p class="sub">Paste an original and a changed version. Removed text is struck through in red, added text is highlighted in green.</p>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch to dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLbl">Dark</span>
    </button>
  </header>

  <section class="inputs" aria-label="Texts to compare">
    <div class="pane">
      <label for="inA">Original</label>
      <textarea id="inA" spellcheck="false" placeholder="Paste the original text"></textarea>
    </div>
    <div class="pane">
      <label for="inB">Changed</label>
      <textarea id="inB" spellcheck="false" placeholder="Paste the changed text"></textarea>
    </div>
  </section>

  <section class="controls" aria-label="Comparison options">
    <div class="group">
      <span class="cap">Compare by</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="words" aria-pressed="true">Words</button>
        <button type="button" data-v="lines" aria-pressed="false">Lines</button>
        <button type="button" data-v="chars" aria-pressed="false">Characters</button>
      </div>
    </div>
    <div class="group">
      <span class="cap">View</span>
      <div class="seg" id="viewSeg">
        <button type="button" data-v="inline" aria-pressed="true">Inline</button>
        <button type="button" data-v="side" aria-pressed="false">Side by side</button>
      </div>
    </div>
    <div class="check-group">
      <label class="check"><input type="checkbox" id="optCase"><span>Ignore case</span></label>
      <label class="check"><input type="checkbox" id="optWs"><span>Ignore whitespace</span></label>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btnSwap">Swap</button>
      <button type="button" class="btn" id="btnExample">Load example</button>
      <button type="button" class="btn" id="btnClear">Clear</button>
    </div>
  </section>

  <section class="stats" id="stats" aria-live="polite"></section>

  <section class="result">
    <div class="result-head">
      <h2>Differences</h2>
      <div class="legend"><span class="l-del"><i></i>Removed from original</span><span class="l-ins"><i></i>Added in changed</span></div>
    </div>
    <div class="out" id="out"></div>
  </section>

  <footer class="credit">Created by <strong>Nabeel Saeed</strong></footer>
</div>

<script>
/* ---------- core diff (Myers) ---------- */
var MAX_EDITS = 3000;
var approx = false;

function tokenize(text, mode, opts) {
  var parts;
  if (mode === 'lines') {
    parts = text.length ? text.split(/\r?\n/) : [];
    if (parts.length && parts[parts.length - 1] === '') parts.pop();
  } else if (mode === 'chars') {
    parts = Array.from(text);
  } else {
    parts = text.match(/\s+|[\p{L}\p{N}_'’]+|[^\s\p{L}\p{N}_'’]/gu) || [];
  }
  return parts.map(function (t) { return { t: t, k: keyOf(t, mode, opts) }; });
}

function keyOf(t, mode, opts) {
  var k = t;
  if (opts.ws) {
    if (mode === 'lines') k = k.replace(/\s+/g, ' ').trim();
    else if (/^\s+$/.test(k)) k = ' ';
  }
  if (opts.ci) k = k.toLowerCase();
  return k;
}

function myers(a, b) {
  var n = a.length, m = b.length, max = n + m;
  if (!max) return [];
  var off = max + 2, v = new Int32Array(2 * max + 5), trace = [], D = -1, d, k, x, y;
  v[off + 1] = 0;
  for (d = 0; d <= max && D < 0; d++) {
    if (d > MAX_EDITS) break;
    trace.push(v.slice(off - d - 1, off + d + 2));
    for (k = -d; k <= d; k += 2) {
      if (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) x = v[off + k + 1];
      else x = v[off + k - 1] + 1;
      y = x - k;
      while (x < n && y < m && a[x].k === b[y].k) { x++; y++; }
      v[off + k] = x;
      if (x >= n && y >= m) { D = d; break; }
    }
  }
  var ops = [], i;
  if (D < 0) {
    approx = true;
    for (i = 0; i < n; i++) ops.push({ o: '-', a: a[i] });
    for (i = 0; i < m; i++) ops.push({ o: '+', b: b[i] });
    return ops;
  }
  x = n; y = m;
  for (d = D; d >= 0; d--) {
    var sn = trace[d], base = off - d - 1;
    k = x - y;
    var pk = (k === -d || (k !== d && sn[off + k - 1 - base] < sn[off + k + 1 - base])) ? k + 1 : k - 1;
    var px = sn[off + pk - base], py = px - pk;
    while (x > px && y > py) { ops.push({ o: '=', a: a[x - 1], b: b[y - 1] }); x--; y--; }
    if (d > 0) {
      if (x === px) ops.push({ o: '+', b: b[y - 1] });
      else ops.push({ o: '-', a: a[x - 1] });
    }
    x = px; y = py;
  }
  return ops.reverse();
}

function diffTokens(a, b) {
  var s = 0, ea = a.length, eb = b.length, i, ops = [];
  while (s < ea && s < eb && a[s].k === b[s].k) s++;
  while (ea > s && eb > s && a[ea - 1].k === b[eb - 1].k) { ea--; eb--; }
  for (i = 0; i < s; i++) ops.push({ o: '=', a: a[i], b: b[i] });
  var mid = myers(a.slice(s, ea), b.slice(s, eb));
  for (i = 0; i < mid.length; i++) ops.push(mid[i]);
  for (i = 0; i < a.length - ea; i++) ops.push({ o: '=', a: a[ea + i], b: b[eb + i] });
  return ops;
}

/* ---------- rendering ---------- */
function esc(s) { return s.replace(/[&<>]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; }); }

// side: 'a' (original, shows removals) | 'b' (changed, shows additions) | 'both' (inline)
function segHtml(ops, side) {
  var out = '', cur = '', buf = '';
  function flush() {
    if (!buf) return;
    out += cur === 'del' ? '<del>' + esc(buf) + '</del>' : cur === 'ins' ? '<ins>' + esc(buf) + '</ins>' : esc(buf);
    buf = '';
  }
  ops.forEach(function (op) {
    var type, text;
    if (op.o === '=') { type = ''; text = side === 'a' ? op.a.t : op.b.t; }
    else if (op.o === '-' && side !== 'b') { type = 'del'; text = op.a.t; }
    else if (op.o === '+' && side !== 'a') { type = 'ins'; text = op.b.t; }
    else return;
    if (type !== cur) { flush(); cur = type; }
    buf += text;
  });
  flush();
  return out;
}

function lineItems(ops, opts) {
  var items = [], i = 0, ln = 1, rn = 1;
  while (i < ops.length) {
    if (ops[i].o === '=') {
      items.push({ type: 'eq', l: esc(ops[i].a.t), r: esc(ops[i].b.t), ln: ln++, rn: rn++ });
      i++; continue;
    }
    var dels = [], adds = [];
    while (i < ops.length && ops[i].o !== '=') { (ops[i].o === '-' ? dels : adds).push(ops[i]); i++; }
    var rows = [], n = Math.max(dels.length, adds.length);
    for (var j = 0; j < n; j++) {
      var d = dels[j], a = adds[j], row = {};
      if (d && a) {
        var w = diffTokens(tokenize(d.a.t, 'words', opts), tokenize(a.b.t, 'words', opts));
        row.lh = segHtml(w, 'a'); row.rh = segHtml(w, 'b');
      } else if (d) row.lh = esc(d.a.t);
      else row.rh = esc(a.b.t);
      row.ln = d ? ln++ : null;
      row.rn = a ? rn++ : null;
      rows.push(row);
    }
    items.push({ type: 'run', rows: rows });
  }
  return items;
}

function renderLinesSide(items) {
  var h = '<table class="lines"><tbody>';
  function row(r) {
    var lc = r.lh === undefined ? 'empty' : 'del', rc = r.rh === undefined ? 'empty' : 'ins';
    return '<tr><td class="n">' + (r.ln || '') + '</td><td class="t ' + lc + '">' + (r.lh || '') + '</td>' +
           '<td class="n">' + (r.rn || '') + '</td><td class="t ' + rc + '">' + (r.rh || '') + '</td></tr>';
  }
  items.forEach(function (it) {
    if (it.type === 'eq') h += '<tr><td class="n">' + it.ln + '</td><td class="t">' + it.l + '</td><td class="n">' + it.rn + '</td><td class="t">' + it.r + '</td></tr>';
    else it.rows.forEach(function (r) { h += row(r); });
  });
  return h + '</tbody></table>';
}

function renderLinesUnified(items) {
  var h = '<table class="lines"><tbody>';
  function row(cls, mark, ln, rn, html) {
    return '<tr class="' + cls + '"><td class="n">' + (ln || '') + '</td><td class="n">' + (rn || '') + '</td><td class="m">' + mark + '</td><td class="t">' + html + '</td></tr>';
  }
  items.forEach(function (it) {
    if (it.type === 'eq') h += row('', '', it.ln, it.rn, it.r);
    else {
      it.rows.forEach(function (r) { if (r.lh !== undefined) h += row('u-del', '−', r.ln, '', r.lh); });
      it.rows.forEach(function (r) { if (r.rh !== undefined) h += row('u-ins', '+', '', r.rn, r.rh); });
    }
  });
  return h + '</tbody></table>';
}

function isCountable(tok, mode) { return mode === 'lines' || /\S/.test(tok.t); }

/* ---------- app ---------- */
var state = { mode: 'words', view: 'inline' };
var EXAMPLE_A = 'Porsche 911 GT3 RS overview\nThe car accelerates from 0 to 100 km/h in 3.2 seconds.\nThe rear wing adds 409 kg of downforce at top speed.\nThe engine produces 525 horsepower.\nThis model is available in limited numbers worldwide.';
var EXAMPLE_B = 'Porsche 911 GT3 RS overview\nThe car accelerates from 0 to 100 km/h in 3.0 seconds with the launch control.\nThe rear wing adds 860 kg of downforce at top speed, up from 409 kg.\nThe engine produces 525 horsepower.\nThis model is available in limited numbers worldwide.\nA Weissach package adds carbon fibre roof and magnesium wheels.';

function $(id) { return document.getElementById(id); }

function run() {
  var A = $('inA').value, B = $('inB').value;
  var opts = { ci: $('optCase').checked, ws: $('optWs').checked };
  var stats = $('stats'), out = $('out');
  approx = false;

  if (!A && !B) {
    stats.innerHTML = '';
    out.innerHTML = '<div class="empty-state">Paste text into both boxes, or choose Load example, to see the differences.</div>';
    return;
  }
  var mode = state.mode;
  var ta = tokenize(A, mode, opts), tb = tokenize(B, mode, opts);
  var ops = diffTokens(ta, tb);

  var add = 0, del = 0, same = 0;
  ops.forEach(function (op) {
    if (op.o === '=') { if (isCountable(op.a, mode)) same++; }
    else if (op.o === '-') { if (isCountable(op.a, mode)) del++; }
    else if (isCountable(op.b, mode)) add++;
  });
  var na = same + del, nb = same + add;
  var sim = na + nb ? Math.round(2 * same / (na + nb) * 100) : 100;
  var unit = mode === 'lines' ? 'lines' : mode === 'chars' ? 'characters' : 'words';
  stats.innerHTML =
    '<div class="stat del"><b>' + del + '</b><span>' + unit + ' removed</span></div>' +
    '<div class="stat ins"><b>' + add + '</b><span>' + unit + ' added</span></div>' +
    '<div class="stat"><b>' + same + '</b><span>' + unit + ' unchanged</span></div>' +
    '<div class="stat"><b>' + sim + '%</b><span>similar</span></div>' +
    (approx ? '<div class="stat note">The texts differ a lot, so the result is simplified.</div>' : '');

  var changed = ops.some(function (o) { return o.o !== '='; });
  if (!changed) { out.innerHTML = '<div class="empty-state">No differences found with these options.</div>'; return; }

  if (mode === 'lines') {
    var items = lineItems(ops, opts);
    out.innerHTML = state.view === 'side' ? renderLinesSide(items) : renderLinesUnified(items);
  } else if (state.view === 'side') {
    out.innerHTML = '<div class="split">' +
      '<div class="col"><div class="hd">Original</div><pre class="flow">' + segHtml(ops, 'a') + '</pre></div>' +
      '<div class="col"><div class="hd">Changed</div><pre class="flow">' + segHtml(ops, 'b') + '</pre></div></div>';
  } else {
    out.innerHTML = '<pre class="flow">' + segHtml(ops, 'both') + '</pre>';
  }
}

var timer = null;
function schedule() { clearTimeout(timer); timer = setTimeout(run, 120); }

function bindSeg(id, key) {
  var seg = $(id);
  seg.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    state[key] = btn.getAttribute('data-v');
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    run();
  });
}

bindSeg('modeSeg', 'mode');
bindSeg('viewSeg', 'view');
$('inA').addEventListener('input', schedule);
$('inB').addEventListener('input', schedule);
$('optCase').addEventListener('change', run);
$('optWs').addEventListener('change', run);
$('btnSwap').addEventListener('click', function () {
  var t = $('inA').value; $('inA').value = $('inB').value; $('inB').value = t; run();
});
$('btnClear').addEventListener('click', function () { $('inA').value = ''; $('inB').value = ''; run(); });
$('btnExample').addEventListener('click', function () { $('inA').value = EXAMPLE_A; $('inB').value = EXAMPLE_B; run(); });

/* ---------- theme switch ---------- */
function currentTheme() {
  var t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t, save) {
  document.documentElement.setAttribute('data-theme', t);
  var next = t === 'dark' ? 'Light' : 'Dark';
  $('themeLbl').textContent = next;
  $('themeBtn').setAttribute('aria-label', 'Switch to ' + next.toLowerCase() + ' theme');
  if (save) { try { localStorage.setItem('text-compare-theme', t); } catch (e) {} }
}
var saved = null;
try { saved = localStorage.getItem('text-compare-theme'); } catch (e) {}
applyTheme(saved === 'dark' || saved === 'light' ? saved : currentTheme(), false);
$('themeBtn').addEventListener('click', function () {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
});

run();
</script>

</body></html>
